# Renders the GitHub stats cards as static SVGs and publishes them to the
# orphan "stats" branch, force-pushed as a single commit each run, so main
# never receives bot commits and the README does not depend on the public
# github-readme-stats server (which is paused and rate limited).
#
# Both cards render with the workflow's own GITHUB_TOKEN, which sees public
# repositories only. To count private repositories as well, add a
# repository secret named GH_STATS_TOKEN holding a classic PAT with the
# "repo" and "read:user" scopes; the workflow prefers it when present.
# A failed render fails the run and keeps the previously published card.
name: Render stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Start from the cards published last time, so a failed render keeps
      # the previous good card instead of dropping it.
      - name: Fetch previously published cards
        run: |
          mkdir -p cards
          if git fetch -q --depth 1 origin stats; then
            git archive FETCH_HEAD | tar -x -C cards
            # Never carry an error card forward.
            grep -l "Something went wrong" cards/*.svg 2>/dev/null | xargs -r rm -v
          else
            echo "No stats branch yet"
          fi

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=blue-green&hide_border=false&layout=compact
          path: cards/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=blue-green&include_all_commits=true
          path: cards/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Publish to the stats branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cards
          if ! ls *.svg >/dev/null 2>&1; then echo "Nothing to publish"; exit 0; fi
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.svg
          git commit -q -m "Render stats cards"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
